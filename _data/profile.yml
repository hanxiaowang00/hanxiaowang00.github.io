short_bio: >-
  <p>
    I am a PhD candidate at <strong>CASIA</strong> and a Research Intern at <strong>Meshy</strong>.
    I work on <strong>next-generation computer graphics</strong> and <strong>unified multimodal generative models</strong>.
  </p>
  <p>
    Previously, I focused on <strong>3D representation</strong> and <strong>mesh generation</strong>.
    I am interested in exploring new frontiers in computer graphics and building generative systems
    that can understand and create rich multimodal content.
  </p>
  <p>
    I am always open to collaboration and would be glad to discuss - please feel free to reach out.
  </p>

